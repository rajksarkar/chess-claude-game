<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess vs Claude</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>♟️ Chess vs Claude</h1>
        <div class="game-info">
            <div class="status" id="status">You are White. Make your move!</div>
            <div class="controls">
                <div class="model-selector">
                    <label for="modelSelect">AI Model:</label>
                    <select id="modelSelect" class="model-select">
                        <option value="claude-sonnet-4-5-20250929">Claude 4.5 Sonnet</option>
                        <option value="claude-opus-4-5-20251101">Claude 4.5 Opus</option>
                        <option value="claude-3-7-sonnet-20250219">Claude 3.7 Sonnet</option>
                        <option value="claude-3-5-sonnet-20241022">Claude 3.5 Sonnet</option>
                        <option value="claude-3-haiku-20240307">Claude 3 Haiku</option>
                    </select>
                </div>
                <button id="newGameBtn" class="btn">New Game</button>
            </div>
        </div>
        <div class="board-container">
            <div class="player-label player-label-top">Claude (Black) ↑</div>
            <div id="board"></div>
            <div class="player-label player-label-bottom">You (White) ↓</div>
        </div>
        <div class="info-panel">
            <div class="move-history">
                <h3>Move History</h3>
                <div id="moveHistory"></div>
            </div>
        </div>
    </div>
    <script src="chess-bundle.js"></script>
    <script src="app.js"></script>
</body>
</html>
